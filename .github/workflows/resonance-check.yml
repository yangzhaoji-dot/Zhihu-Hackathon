name: Resonance branch check

on:
  push:
    branches: [resonance-scroll-v1]
  pull_request:
    branches: [scene-environment-first-v1, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
