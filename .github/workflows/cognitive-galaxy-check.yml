name: Cognitive galaxy check
on:
  push:
    branches: [cognitive-galaxy-v1]
  pull_request:
    branches: [resonance-scroll-v1]
permissions:
  contents: read
concurrency:
  group: cognitive-galaxy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Public, non-credential fixture: the existing SDK requires a host app ID to render.
      # No authenticated Eazo or Zhihu operation is exercised with this fixture.
      EAZO_APP_ID: cognitive-galaxy-ci
      NEXT_PUBLIC_APP_TITLE: Zhihu Universe
      NEXT_PUBLIC_APP_DESCRIPTION: Cognitive galaxy interface acceptance fixture
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun test scripts/cognitive-galaxy.test.ts
      - run: bun run lint
      - run: bun run build
      - name: Install isolated browser test runner
        run: |
          npm install --prefix /tmp/cognitive-browser --no-package-lock playwright@1.51.1
          /tmp/cognitive-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser navigation and screenshots
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/cognitive-browser/node_modules/playwright
        run: |
          mkdir -p test-artifacts/galaxy
          bun run start > /tmp/cognitive-server.log 2>&1 &
          for i in $(seq 1 20); do curl -s http://localhost:3000/ > /dev/null && break; sleep 1; done
          status=$(curl -s -o test-artifacts/galaxy/home-response.html -w '%{http_code}' http://localhost:3000/)
          echo "Homepage HTTP status: $status"
          if [ "$status" != "200" ]; then
            tail -n 80 /tmp/cognitive-server.log
            cp /tmp/cognitive-server.log test-artifacts/galaxy/server.log
            exit 1
          fi
          node scripts/cognitive-galaxy-browser.mjs || { tail -n 80 /tmp/cognitive-server.log; cp /tmp/cognitive-server.log test-artifacts/galaxy/server.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cognitive-galaxy-preview
          path: test-artifacts/galaxy
          if-no-files-found: ignore
