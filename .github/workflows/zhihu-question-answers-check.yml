name: Zhihu question answers check

on:
  push:
    branches: [feat/real-question-answers-api, web-redesign-v1]
    paths:
      - "src/lib/opinion/zhihu-*.ts"
      - "src/lib/opinion/types.ts"
      - "src/lib/opinion/build-opinion-graph.ts"
      - "scripts/zhihu-question-answers.test.ts"
      - "scripts/cognitive-galaxy.test.ts"
      - ".github/workflows/zhihu-question-answers-check.yml"
  pull_request:
    branches: [web-redesign-v1]
    paths:
      - "src/lib/opinion/zhihu-*.ts"
      - "src/lib/opinion/types.ts"
      - "src/lib/opinion/build-opinion-graph.ts"
      - "scripts/zhihu-question-answers.test.ts"
      - "scripts/cognitive-galaxy.test.ts"
      - ".github/workflows/zhihu-question-answers-check.yml"

permissions:
  contents: read

concurrency:
  group: zhihu-question-answers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EAZO_APP_ID: zhihu-question-answers-ci
      NEXT_PUBLIC_APP_TITLE: Zhihu Universe
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile
      - run: bun test scripts/cognitive-galaxy.test.ts scripts/zhihu-question-answers.test.ts
      - run: bun run lint
      - run: bun run build
